


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
</head>

    <style>
        h1{
            background-color: blue;
            color: white;
            border-width: 2px;
            border-style: solid;
            border-color: red;
            
        }
        h2{
            background-color: yellow;
            color: red;
            border: 2px solid red;
        }
        .heading{
            background-color: purple;
            color: white;
        }

        .bg-danger{
            background-color: red;
            color: yellow;
        }

        .border-success{
            border: 5px solid black;
        }

        .bg-primary{
            background-color: blue;
        }
        .text-white{
            color: white;
        }

    </style>

    


<body>
    <h1>Internal CSS</h1>
    <h2>Hello world </h2>

    <h2 class="heading"> internal Css using Classname </h2>

    <h2 class="bg-danger border-success">Danger</h2>

    <h2 class="bg-primary text-white">ASP.NET</h2>

    <h3> Internal CSS style using ID</h3>
    
</body>
</html>
